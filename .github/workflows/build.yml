name: Build and release ASI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Zig 0.15.2
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'zig.zip'
          Invoke-WebRequest 'https://ziglang.org/download/0.15.2/zig-x86_64-windows-0.15.2.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '3a0ed1e8799a2f8ce2a6e6290a9ff22e6906f8227865911fb7ddedc3cc14cb0c') { throw 'Zig archive checksum mismatch' }
          Expand-Archive $archive -DestinationPath $env:RUNNER_TEMP
          (Join-Path $env:RUNNER_TEMP 'zig-x86_64-windows-0.15.2') >> $env:GITHUB_PATH
      - name: Build the native ASI
        run: ./tools/build_native.ps1
      - name: Verify DLL and unsupported-host guard
        run: |
          python -m pip install pefile==2024.8.26
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          python tools/verify_native_build.py --artifact-only
          if ($LASTEXITCODE -ne 0) { throw 'DLL verification failed' }
          & ./build/guard_probe.exe (Resolve-Path ./build/SendToStash.asi).Path
          if ($LASTEXITCODE -ne 0) { throw 'Unsupported-host guard failed' }
      - name: Package ASI-only and ASI-with-loader ZIPs
        run: |
          python tools/package.py
          if ($LASTEXITCODE -ne 0) { throw 'Package verification failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: SendToStash-windows-x64
          path: build/packages/
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SendToStash-windows-x64
          path: package
      - name: Publish tested build as a prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd package
          sha256sum --check SHA256SUMS.txt
          cd ..
          cat > release-notes.md <<'EOF'
          Native SendToStash ASI beta build. No UE4SS dependency.

          Unified startup resolution validates relevant native code and relationships once before enabling hooks; there is no whole-executable hash shortcut or runtime scanning. Address-only changes may be tolerated, but future game versions still require testing. Documentation, licenses, and internal checksums now live under SendToStash/; only the ASI and optional loader are at the ZIP root. When using another ASI mod, choose the ASI-only package for one mod so only one package supplies winhttp.dll. Replace the old SendToStash installation in Vortex and redeploy.

          Choose SendToStash-ASI-only.zip if an ASI loader is already installed. Otherwise choose SendToStash-ASI-with-loader.zip, which includes Ultimate ASI Loader 9.7.4 as winhttp.dll. Both include installation guidance, checksums, and applicable licenses.

          The author confirmed the unified ASI works in-game on Steam v2.0.6 on October 22, 2026. Earlier regression tests confirmed partial transfers, cancellation, and retention of weapon ammunition, attachments, and upgrades. Earlier testing confirmed save/reload persistence and weapon condition retention. Relocated-build gameplay remains untested.

          CI validated the DLL, unsupported-host guard, loader checksums, and ZIP contents. The menu label is English-only. See README for the supported executable and installation instructions.
          EOF
          gh release create "$RELEASE_TAG" package/SendToStash-ASI-only.zip package/SendToStash-ASI-with-loader.zip package/SHA256SUMS.txt \
            --verify-tag --title "SendToStash $RELEASE_TAG" --prerelease --notes-file release-notes.md
