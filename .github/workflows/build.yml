name: Build and release ASI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Zig 0.15.2
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'zig.zip'
          Invoke-WebRequest 'https://ziglang.org/download/0.15.2/zig-x86_64-windows-0.15.2.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '3a0ed1e8799a2f8ce2a6e6290a9ff22e6906f8227865911fb7ddedc3cc14cb0c') { throw 'Zig archive checksum mismatch' }
          Expand-Archive $archive -DestinationPath $env:RUNNER_TEMP
          (Join-Path $env:RUNNER_TEMP 'zig-x86_64-windows-0.15.2') >> $env:GITHUB_PATH
      - name: Build the native ASI
        run: ./tools/build_native.ps1
      - name: Verify DLL and unsupported-host guard
        run: |
          python -m pip install pefile==2024.8.26
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          python tools/verify_native_build.py --artifact-only
          if ($LASTEXITCODE -ne 0) { throw 'DLL verification failed' }
          & ./build/guard_probe.exe (Resolve-Path ./build/SendToStash.asi).Path
          if ($LASTEXITCODE -ne 0) { throw 'Unsupported-host guard failed' }
      - name: Package ASI-only and ASI-with-loader ZIPs
        run: |
          python tools/package.py
          if ($LASTEXITCODE -ne 0) { throw 'Package verification failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: SendToStash-windows-x64
          path: build/packages/
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SendToStash-windows-x64
          path: package
      - name: Publish tested release packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd package
          sha256sum --check SHA256SUMS.txt
          cd ..
          cat > release-notes.md <<'EOF'
          SendToStash v0.2.0. Native ASI; no UE4SS dependency.

          Adds the audited Steam v2.1.0 layout alongside v2.0.6 and the supplied alternative layout. One shared inventory implementation uses addresses and the container-pool layout validated once at startup. Unknown or ambiguous layouts refuse hooks; no whole-EXE hash bypass or per-frame scanning. Successful initialization now logs ACTIVE after both hooks are enabled.

          Choose SendToStash-ASI-only.zip if an ASI loader is already installed. Otherwise choose SendToStash-ASI-with-loader.zip, which includes Ultimate ASI Loader 9.7.4 as winhttp.dll. Both include installation guidance, checksums, and applicable licenses.

          All three supplied executables passed local offline inspection and relocation, altered-code, ambiguity and native-reference/layout checks. Candidate v2.1.0 startup logs confirmed activation. Complete current-release gameplay/save regression remains pending; earlier release gameplay evidence is historical. The alternative input was inspected as data only. No game executable is included.

          CI validated the DLL, unsupported-host guard, loader checksums, and ZIP contents. The menu label is English-only. See README for the supported executable and installation instructions.
          EOF
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" package/SendToStash-ASI-only.zip package/SendToStash-ASI-with-loader.zip package/SHA256SUMS.txt \
            --verify-tag --title "SendToStash $RELEASE_TAG" "${flags[@]}" --notes-file release-notes.md
